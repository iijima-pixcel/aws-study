AWSTemplateFormatVersion: 2010-09-09
Description: Aws-Study-ApplicationLayer

Parameters:
  DBMasterUsername:
    Type: String
    Default: admin
    Description: Master username for the RDS instance

  AMI:
    Type: AWS::EC2::Image::Id
    Description: AMI ID for the EC2 instance
    Default: ami-01205c30badb279ec

Resources:
  
  # Application Load Balancer
  AwsStudyApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: AwsStudyALB
      Subnets:
        - !ImportValue AwsStudyPublicSubnet1aId
        - !ImportValue AwsStudyPublicSubnet1cId
      SecurityGroups:
        - !ImportValue AwsStudyAlbSecurityGroupId
      Scheme: internet-facing
      Type: application
      Tags:
        - Key: Name
          Value: AwsStudyALB
        - Key: Project
          Value: AwsStudy
  
  # ALB Listener
  AwsStudyAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AwsStudyApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AwsStudyAlbTargetGroup   
  
  # Target Group
  AwsStudyAlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: AwsStudyTargetGroup
      Protocol: HTTP
      Port: 8080
      VpcId: !ImportValue AwsStudyVpcId
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref AwsStudyEc2Instance
          Port: 8080
      Tags:
        - Key: Name
          Value: AwsStudyTargetGroup
        - Key: Project
          Value: AwsStudy
  
  # EC2 Instance
  AwsStudyEc2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: false
          SubnetId: !ImportValue AwsStudyPrivateSubnet1aId
          GroupSet:
            - !ImportValue AwsStudyEc2SecurityGroupId
          DeleteOnTermination: true
      IamInstanceProfile: !ImportValue AwsStudy-Cfn-EC2-Instance-Profile-Name
      UserData:
        Fn::Base64:  |
          #!/bin/bash
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
      Tags:
        - Key: Name
          Value: AwsStudyEC2
        - Key: Project
          Value: AwsStudy

  # RDS Instance (MySQL)
  AwsStudyRdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: aws-study-db
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: mysql
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: '{{resolve:ssm-secure:/rds/master/password}}'
      DBSubnetGroupName: !Ref AwsStudyRdsSubnetGroup
      VPCSecurityGroups:
        - !ImportValue AwsStudyRdsSecurityGroupId
      BackupRetentionPeriod: 7
      PubliclyAccessible: false
      MultiAZ: false
      Tags:
        - Key: Name
          Value: AwsStudyRDS
        - Key: Project
          Value: AwsStudy

  # RDS Subnet Group
  AwsStudyRdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for AwsStudy RDS
      SubnetIds:
        - !ImportValue AwsStudyPrivateSubnet1aId
        - !ImportValue AwsStudyPrivateSubnet1cId
      DBSubnetGroupName: AwsStudyDbSubnetGroup
      Tags:
        - Key: Name
          Value: AwsStudyDbSubnetGroup
        - Key: Project
          Value: AwsStudy
